<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display">
            <div id="11" class="d11 grid"></div>
            <div id="12" class="d12 grid"></div>
            <div id="13" class="d13 grid"></div>
            <div id="21" class="d21 grid"></div>
            <div id="22" class="d22 grid"></div>
            <div id="23" class="d23 grid"></div>
            <div id="31" class="d31 grid"></div>
            <div id="32" class="d32 grid"></div>
            <div id="33" class="d33 grid"></div>
        </div>
        <div class="currentStatus">Player 1's Turn</div>
        <div class="inputName">
            <form action="#" method="get" class="inputNames" id="inputNames">
                <div class="p1Name">
                    <label for="p1Name">Player 1 name:</label>
                    <input type="text" id="p1Name" name="p1Name" required>
                </div>
                <div class="p2Name">
                    <label for="p2Name">Player 2 name:</label>
                    <input type="text" id="p2Name" name="p2Name" required>
                </div>

                <button class="submit" type="submit">Submit</button>
            </form>
        </div>
        <button  class="restartBtn">Restart</button>

        

    </div>
    
    <script src="script.js"></script>
</body>
</html>
